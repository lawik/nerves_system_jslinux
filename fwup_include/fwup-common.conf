# Common fwup definitions for nerves_system_jslinux
#
# Disk layout (512-byte blocks). Kept small because the whole image is
# served to the browser in 256 KB chunks; regions are aligned to 512 blocks
# so a region boundary is always a chunk boundary.
#
# +----------------------------+
# | MBR                        |  block 0
# +----------------------------+
# | U-Boot environment (128 KB)|  block 16
# +----------------------------+
# | Kernel A (16 MB)           |  block 512    (0x200)
# +----------------------------+
# | Kernel B (16 MB)           |  block 33280  (0x8200)
# +----------------------------+
# | p1: Rootfs A (32 MB)       |  block 66048  (0x10200)
# +----------------------------+
# | p2: Rootfs B (32 MB)       |  block 131584 (0x20200)
# +----------------------------+
# | p3: Application (64 MB)    |  block 197120 (0x30200)
# +----------------------------+

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "jslinux")
define(NERVES_FW_ARCHITECTURE, "riscv")
define(NERVES_FW_AUTHOR, "The Nerves Team")

define(NERVES_FW_DEVPATH, "/dev/vda")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/vda3")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")

define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# This configuration file will create an image that has an MBR and the
# following layout:
define(UBOOT_ENV_OFFSET, 16)
define(UBOOT_ENV_COUNT, 256)   # 128 KB

define(KERNEL_A_OFFSET, 512)
define(KERNEL_COUNT, 32768)    # 16 MB
define-eval(KERNEL_B_OFFSET, "${KERNEL_A_OFFSET} + ${KERNEL_COUNT}")

# U-Boot's "virtio read" takes hexadecimal block numbers, so the kernel
# offsets are also stored in the environment as hex strings. Keep these in
# sync with the decimal definitions above.
define(KERNEL_A_LBA_HEX, "0x200")
define(KERNEL_B_LBA_HEX, "0x8200")

define-eval(ROOTFS_A_PART_OFFSET, "${KERNEL_B_OFFSET} + ${KERNEL_COUNT}")
define(ROOTFS_A_PART_COUNT, 65536) # 32 MB
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application partition. This partition can occupy all of the remaining space.
# Size it to fit the destination.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 131072) # 64 MB (mkfs.f2fs refuses smaller volumes)
define-eval(APP_PART_REAR_PAD, "${APP_PART_OFFSET} + ${APP_PART_COUNT} - 256")

# Firmware metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
